[project]
name = "timetidy-ai-engine"
version = "1.0.0"
description = "AI engine for Time Tidy - CLIP-based image tagging"
requires-python = ">=3.10"

dependencies = [
    "onnxruntime~=1.16.0",
    "Pillow~=10.0.0",
    "numpy~=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
